name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: 'release-binaries'
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Bun (for cross-compilation)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Canvas Web UI and embed assets
        run: |
          pnpm --filter ...canvas-web build
          node --experimental-strip-types scripts/embed-canvas.ts
          node --experimental-strip-types scripts/embed-resvg-wasm.ts

      - name: Build all workspace packages
        run: pnpm --filter ...@vitra/cli build

      - name: Bundle standalone executable (inlining workspace packages)
        run: |
          mkdir -p binaries
          bun build ./packages/cli/dist/bin.js \
            --target=node \
            --outfile=./binaries/vitra \
            --external=@resvg/resvg-js \
            --external=fsevents

          sed -i '/^#!\/usr\/bin\/env node/d' ./binaries/vitra
          sed -i '1s|^|#!/usr/bin/env node\n|' ./binaries/vitra
          chmod +x ./binaries/vitra
          cp ./binaries/vitra ./binaries/vitra-standalone.mjs

      - name: Cross-compile standalone native binaries
        run: |
          echo "Building Linux x64 binary..."
          bun build --compile --target=bun-linux-x64 ./packages/cli/dist/bin.js --outfile ./binaries/vitra-linux-x64 --external=@resvg/resvg-js --external=fsevents || true

          echo "Building Linux ARM64 binary..."
          bun build --compile --target=bun-linux-arm64 ./packages/cli/dist/bin.js --outfile ./binaries/vitra-linux-arm64 --external=@resvg/resvg-js --external=fsevents || true

          echo "Building macOS Intel x64 binary..."
          bun build --compile --target=bun-darwin-x64 ./packages/cli/dist/bin.js --outfile ./binaries/vitra-darwin-x64 --external=@resvg/resvg-js --external=fsevents || true

          echo "Building macOS Apple Silicon arm64 binary..."
          bun build --compile --target=bun-darwin-arm64 ./packages/cli/dist/bin.js --outfile ./binaries/vitra-darwin-arm64 --external=@resvg/resvg-js --external=fsevents || true

          echo "Building Windows x64 binary..."
          bun build --compile --target=bun-windows-x64 ./packages/cli/dist/bin.js --outfile ./binaries/vitra-windows-x64.exe --external=@resvg/resvg-js --external=fsevents || true

          ls -lh binaries/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Vitra CLI ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            binaries/vitra
            binaries/vitra-standalone.mjs
            binaries/vitra-linux-x64*
            binaries/vitra-linux-arm64*
            binaries/vitra-darwin-x64*
            binaries/vitra-darwin-arm64*
            binaries/vitra-windows-x64.exe*
            scripts/install.sh
            scripts/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
