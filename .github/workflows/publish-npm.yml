name: Publish vitra-cli to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (audit package contents without publishing)'
        type: boolean
        default: false

concurrency:
  group: 'npm-publish'
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build all workspace packages
        run: pnpm --filter ...@vitra/cli build

      - name: Run test suite
        run: pnpm test

      - name: Bundle standalone executable (zero sourcemaps)
        run: |
          npx esbuild packages/cli/dist/bin.js \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=packages/cli/dist/bin.js \
            --allow-overwrite \
            --banner:js='#!/usr/bin/env node' \
            --external:@resvg/resvg-js \
            --external:ws \
            --external:fsevents \
            --sourcemap=false

      - name: Prepare standalone package metadata & sanitize dist
        run: node packages/cli/scripts/prepare-publish.js

      - name: Audit tarball contents (Verify no sourcemaps or internal files leak)
        working-directory: packages/cli
        run: |
          echo "=== AUDITING NPM PACKAGE CONTENTS ==="
          npm pack --dry-run

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: packages/cli
        run: npm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
