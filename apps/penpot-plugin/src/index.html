<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vitra Live Sync - Penpot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <svg class="icon-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0066ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 22 22 22"></polygon></svg>
      <span class="logo">Vitra</span>
      <span class="badge">Penpot Sync</span>
    </div>
    <div class="status-pill">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
  </div>

  <!-- Connection & Mode -->
  <div class="card">
    <div class="field">
      <label>Sync Server WebSocket</label>
      <div class="input-row">
        <input type="text" id="server-url" value="ws://localhost:9876" spellcheck="false" />
        <button id="btn-connect" onclick="toggleConnect()">Connect</button>
      </div>
    </div>
    <div class="toggle-row">
      <span style="font-size: 11px;">Live Auto-Sync Mode</span>
      <label class="switch">
        <input type="checkbox" id="live-toggle" onchange="toggleLiveMode(this.checked)" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Branch Selector Card -->
  <div class="card" id="branch-card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px;">
        <svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
        Active Branch
      </span>
      <span id="active-branch-name" style="font-size: 10px; color: var(--success); font-family: monospace;">main</span>
    </div>
    <div class="branch-select-wrap">
      <svg class="icon-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
      <select id="branch-select" onchange="switchBranch(this.value)">
        <option value="main">main</option>
      </select>
    </div>
  </div>

  <!-- Version History Timeline Card -->
  <div class="card" id="history-card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px;">
        <svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Version Timeline
      </span>
      <span id="commit-count-badge" style="font-size: 9px; background: #252525; padding: 1px 5px; border-radius: 4px; color: var(--text-muted);">0 commits</span>
    </div>
    <div class="commit-timeline" id="commit-list">
      <div style="color: #666; font-size: 10px; text-align: center; padding: 10px 0;">Connect to view history</div>
    </div>
  </div>

  <!-- Manual Actions Card -->
  <div class="card">
    <div style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;">Manual Sync Actions</div>
    <div class="btn-grid">
      <button id="btn-pull" onclick="pullFromVitra()" disabled>
        <svg class="icon-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Pull from Vitra
      </button>
      <button id="btn-push-sel" class="secondary" onclick="pushSelection()" disabled>
        <svg class="icon-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        Push Selection
      </button>
    </div>
    <div style="margin-top: 6px;">
      <button id="btn-push-all" class="secondary" style="width: 100%;" onclick="pushAll()" disabled>
        <svg class="icon-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        Push Entire Page to Vitra
      </button>
    </div>
  </div>

  <!-- Activity Stream -->
  <div class="card" style="margin-bottom: 0;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Activity Stream</span>
      <span style="font-size: 10px; color: #555; cursor: pointer;" onclick="clearLog()">Clear</span>
    </div>
    <div class="log-container" id="log">
      <div class="log-entry log-info"><span class="log-time">[Init]</span> Penpot plugin loaded. Ready to sync.</div>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
